name: scan_products

# La app no se publica en pub.dev
publish_to: "none"

version: 2.0.0+1

# Descripcion publicada en las tiendas
description: "Punto de venta e inventario con escaneo de codigos de barras"

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter

  # Persistencia local (base de datos + preferencias de tema)
  sqflite: ^2.4.1
  path: ^1.9.0

  # Escaneo de codigos de barras
  barcode_scan2: ^4.5.0

  # UI: animaciones, formato de moneda, preferencia de tema
  flutter_animate: ^4.5.2
  intl: ^0.20.2
  shared_preferences: ^2.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  # sqflite no funciona en entornos headless; las pruebas usan la variante FFI
  sqflite_common_ffi: ^2.4.3

  flutter_lints: ^5.0.0

  # Generador del icono de la app
  flutter_launcher_icons: ^0.14.3

flutter_icons:
  android: true
  ios: true
  image_path: "assets/stock.png"
  adaptive_icon_background: "#07060F"   # Solo para Android
  adaptive_icon_foreground: "assets/app_icon_foreground.png"

flutter:
  uses-material-design: true

  assets:
  - assets/stock.png
  - assets/app_icon_foreground.png
