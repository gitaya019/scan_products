include: package:flutter_lints/flutter.yaml

analyzer:
  errors:
    todo: ignore
  exclude:
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**

linter:
  rules:
    # Lints que detectan bugs reales o inconsistencias, no estilo.
    - avoid_empty_else
    - avoid_relative_lib_imports
    - avoid_types_as_parameter_names
    - avoid_types_on_closure_parameters
    - cancel_subscriptions
    - close_sinks
    - directives_ordering
    - unnecessary_await_in_return
    - unnecessary_parenthesis
    - use_super_parameters

# Nota: no se activan `sort_constructors_first` ni `require_trailing_commas`.
# El codigo sigue el patron de campos -> constructor -> metodos, y el lint de
# constructores exigiria lo contrario en todas las pantallas.
